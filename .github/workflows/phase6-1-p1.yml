name: Phase 6.1 P1 verification

on:
  pull_request:
    branches:
      - main
    paths:
      - "shared/engineering.ts"
      - "shared/engineering.v2-compatibility.test.ts"
      - "shared/engineering.v2-compatibility.fixtures.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - ".github/workflows/phase6-1-p1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1-verification:
    name: P1 targeted tests, type-check, and full suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Phase 6.1 P1 compatibility tests
        run: pnpm exec vitest run shared/engineering.v2-compatibility.test.ts

      - name: Type-check project
        run: pnpm exec tsc --noEmit

      - name: Run full test suite
        run: pnpm test
